<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube & Web AdBlocker Pro</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-card">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-box">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <polygon points="10 8 16 12 10 16 10 8" fill="currentColor"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>AdBlocker Pro</h1>
          <span class="version-tag">YouTube Turbo v1.0</span>
        </div>
      </div>
      
      <!-- Power Switch -->
      <label class="power-switch" title="Activar / Desactivar AdBlocker">
        <input type="checkbox" id="masterToggle" checked>
        <span class="power-slider">
          <svg class="power-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0M12 2v10"/>
          </svg>
        </span>
      </label>
    </header>

    <!-- Status Banner -->
    <div class="status-banner" id="statusBanner">
      <span class="status-dot"></span>
      <span id="statusText">Protección Activa en YouTube</span>
    </div>

    <!-- Live Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon red-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
        </div>
        <div class="stat-info">
          <span class="stat-value" id="statToday">0</span>
          <span class="stat-label">Bloqueados Hoy</span>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon yt-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"/>
            <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02" fill="currentColor"/>
          </svg>
        </div>
        <div class="stat-info">
          <span class="stat-value" id="statYouTube">0</span>
          <span class="stat-label">YouTube Saltados</span>
        </div>
      </div>

      <div class="stat-card full-width">
        <div class="stat-icon cyan-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        </div>
        <div class="stat-info">
          <span class="stat-value" id="statTimeSaved">0s</span>
          <span class="stat-label">Tiempo Ahorrado Estimado</span>
        </div>
      </div>
    </div>

    <!-- Quick Features Toggles -->
    <div class="features-list">
      <div class="feature-item">
        <div class="feature-title">
          <span class="feature-badge yt-badge">YouTube</span>
          <span>Salto Turbo de Anuncios</span>
        </div>
        <label class="toggle-sm">
          <input type="checkbox" id="ytTurboToggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="feature-item">
        <div class="feature-title">
          <span class="feature-badge mute-badge">Audio</span>
          <span>Silenciar Anuncios Auto</span>
        </div>
        <label class="toggle-sm">
          <input type="checkbox" id="ytMuteToggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="actions-group">
      <button class="btn btn-secondary" id="btnElementPicker">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="16"/>
          <line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
        Bloquear Elemento
      </button>

      <button class="btn btn-secondary" id="btnToggleWhitelist">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span id="whitelistBtnText">Desactivar en este sitio</span>
      </button>
    </div>

    <!-- Footer link to Options -->
    <footer class="footer">
      <button class="btn-link" id="btnOpenOptions">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        Configuración Avanzada y Entorno Python
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
